[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonetops"
version = "0.1.14"
description = "Autonetops CLI for labs and exercises"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Pedro C Damasceno" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.1.7",
    "PyYAML>=6.0",
    "scrapli[asyncssh]>=2024.1.30",
    "rich>=13.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
autonetops = "autonetops.autonetops:cli"

[project.urls]
Homepage = "https://github.com/autonetops/autonetops_cli"
Repository = "https://github.com/autonetops/autonetops_cli"

[tool.setuptools.packages.find]
include = ["autonetops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
